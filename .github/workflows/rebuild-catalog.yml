name: Rebuild Catalog

on:
  repository_dispatch:
    types: [catalog-updated]
  schedule:
    - cron: "23 */6 * * *"   # safety net for lost dispatches
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rebuild and diff only, do not commit/push"
        type: boolean
        default: false

concurrency:
  group: catalog-rebuild
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout rvb website branch (manifest source)
        # Public repo, anonymous shallow clone — the branch replaces the old
        # per-release build.json asset downloads entirely.
        run: git clone --depth 1 --branch website "https://github.com/$RVB_REPO.git" rvb-website
        env:
          RVB_REPO: nullcpy/rvb

      - name: Checkout rvb naming rules (filename parsing source of truth)
        # rebuild_catalog.py imports normalize_key/normalize_arch/extract_arch/
        # file_prefix from rvb's .github/scripts/naming.py instead of mirroring them,
        # so the builder and the catalogue cannot parse a filename differently.
        # Blob-filtered + sparse: this fetches the script directory, not the repo.
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            "https://github.com/$RVB_REPO.git" rvb-code
          git -C rvb-code sparse-checkout init --cone
          git -C rvb-code sparse-checkout set .github/scripts
          git -C rvb-code checkout main
          test -f rvb-code/.github/scripts/naming.py
        env:
          RVB_REPO: nullcpy/rvb

      - name: Rebuild data.json from website branch manifests
        env:
          RVB_REPO: nullcpy/rvb
          RVB_NAMING_DIR: ${{ github.workspace }}/rvb-code/.github/scripts
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # available by default; gh reads this implicitly
        run: |
          cp data.json temp_old_data.json
          python3 .github/scripts/rebuild_catalog.py --repo "$RVB_REPO" --manifest-dir rvb-website --out data.json.new --existing temp_old_data.json
          echo "REBUILT_OK=1" >> "$GITHUB_ENV"

      - name: Report diff
        run: |
          echo "### Rebuilt catalog summary" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          new = json.load(open("data.json.new"))
          apps = len(new["apps"])
          builds = sum(len(b["builds"]) for a in new["apps"] for b in a["brands"])
          assets = sum(len(x["assets"]) for a in new["apps"] for b in a["brands"] for x in b["builds"])
          print(f"- apps: {apps}, build entries: {builds}, assets: {assets}")
          EOF

      - name: Commit and push (if content changed)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Compare ignoring updated_at, which changes every run
          strip() { python3 -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('updated_at',None); print(json.dumps(d,sort_keys=True,separators=(',',':')))" "$1"; }
          if cmp -s <(strip data.json) <(strip data.json.new); then
            echo "No material catalog change."
            rm -f data.json.new
            exit 0
          fi
          mv data.json.new data.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "chore: rebuild catalog from website branch manifests [skip ci]"
          # Note: the push itself won't redeploy Pages (deploy-pages.yml ignores data.json
          # pushes); an explicit dispatch below refreshes the deployed copy instead.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin main; then pushed=1; break; fi
            echo "Push attempt $attempt failed; integrating with remote..."
            if ! git pull --rebase origin main; then
              # Conflict in a derived file: drop our commit and let the next
              # (dispatch/scheduled) rebuild converge from fresh inputs.
              git rebase --abort || true
              git fetch origin main && git reset --hard origin/main
              echo "::warning::Conflicting catalog push; deferred to next rebuild run."
              exit 0
            fi
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::Failed to push rebuilt data.json after 3 attempts."
            exit 1
          fi
          echo "CATALOG_PUSHED=1" >> "$GITHUB_ENV"

      - name: Trigger Pages deployment
        # data.json is served from the deployed Pages copy, so refresh it explicitly.
        if: env.CATALOG_PUSHED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Dispatched deploy-pages workflow."

      - name: Trigger Vercel mirror deployment
        # The Vercel project is git-connected to this repo, so site-file pushes
        # auto-deploy unaided. This hook exists for the one case auto-deploy cannot
        # see: the commit above carries [skip ci], a token Vercel honours, so without
        # it the mirror would keep serving whatever catalog it was imported with.
        # Non-fatal: Pages is canonical, and the next site-file push re-syncs the
        # mirror anyway (that deploy ships the whole repo, data.json included).
        if: env.CATALOG_PUSHED == '1'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK secret not set; skipping Vercel mirror."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"; then
              echo "Triggered Vercel mirror deployment."
              exit 0
            fi
            echo "Vercel hook attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "::warning::Failed to trigger the Vercel mirror after 3 attempts; it stays on the previous catalog."

  trigger_notify_failure:
    needs: [rebuild]
    if: failure()
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Rebuild Catalog"
    secrets: inherit
