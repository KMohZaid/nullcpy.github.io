name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Skip pushes that can't change the deployed site:
    # - data.json: catalog rebuilds (dispatched explicitly by rebuild-catalog.yml)
    # - .github/, .gitignore, README/LICENSE/CONFIG: repo maintenance, not site content
    paths-ignore:
      - 'data.json'
      - '.github/**'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'CONFIG.md'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # required by the workflow-run cleanup step below

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages (with Retries)
        id: deployment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 10000 # Wait 10 seconds between retries

      - name: Notify fork mirror
        # Vercel builds from the fahim-ahmed05/nullstore fork, which copies this
        # repo's site files and lets its own push trigger the deploy. A Vercel
        # Deployment Hook is the wrong tool here: a hook rebuilds the FORK's
        # committed state, which is still unchanged until the fork pulls. Content
        # has to move first, so this is a git nudge rather than a Vercel call.
        # No client_payload needed -- the fork always syncs to upstream main's tip.
        # Best-effort by design: this is the mirror's ONLY automatic trigger (forks
        # cannot run scheduled workflows, so there is no cron behind it), but a nudge
        # failure must never fail a Pages deploy that succeeded -- recovery is manual
        # via the fork's "Sync from Upstream" workflow_dispatch.
        # Covers catalog rebuilds too, because rebuild-catalog.yml dispatches this.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FORK_SYNC_TOKEN not set; the fork mirror will not auto-sync -- run its 'Sync from Upstream' workflow manually."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api -X POST repos/fahim-ahmed05/nullstore/dispatches -f event_type=upstream-catalog; then
              echo "Dispatched upstream-catalog to the fork mirror."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "::warning::Could not reach the fork mirror after 3 attempts; it stays on the previous catalog until synced manually."

      - name: Remove older workflow runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' |
            tail -n+11 |
            xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

  trigger_notify_failure:
    needs: [ deploy ]
    if: failure()
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Deploy to GitHub Pages"
    secrets: inherit
